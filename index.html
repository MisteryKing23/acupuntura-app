<!DOCTYPE html>
<html lang="es">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mapa de Acupuntura</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Single-theme dark app — a focused clinical tool */
:root {
  --bg: #0f1623;
  --surface: #161d2e;
  --surface-raised: #1c2538;
  --border: rgba(255,255,255,0.07);
  --text: #e8eaf0;
  --text-muted: #8891a4;
  --accent: #e05070;
  --accent-glow: rgba(224,80,112,0.25);
  --accent-dim: rgba(224,80,112,0.12);
  color-scheme: dark;

  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f5f0;
    --surface: #ffffff;
    --surface-raised: #f0f0eb;
    --border: rgba(0,0,0,0.08);
    --text: #1a1a2e;
    --text-muted: #6b7080;
    --accent: #c03050;
    --accent-glow: rgba(192,48,80,0.15);
    --accent-dim: rgba(192,48,80,0.08);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f5f5f0;
  --surface: #ffffff;
  --surface-raised: #f0f0eb;
  --border: rgba(0,0,0,0.08);
  --text: #1a1a2e;
  --text-muted: #6b7080;
  --accent: #c03050;
  --accent-glow: rgba(192,48,80,0.15);
  --accent-dim: rgba(192,48,80,0.08);
  color-scheme: light;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  touch-action: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-user-select: none;
  user-select: none;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 100%;
}

/* Header */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  flex-shrink: 0;
  gap: 8px;
}

header h1 {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.3px;
  white-space: nowrap;
}

.view-toggle {
  display: flex;
  gap: 3px;
  background: var(--surface);
  border-radius: 10px;
  padding: 3px;
  flex-shrink: 0;
}

.view-toggle button {
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  padding: 5px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}

.view-toggle button.active {
  background: var(--accent);
  color: white;
}

/* Filter bar */
.filter-bar {
  display: flex;
  gap: 5px;
  padding: 6px 0;
  overflow-x: auto;
  flex-shrink: 0;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }

.filter-chip {
  flex-shrink: 0;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: none;
  color: var(--text-muted);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}

.filter-chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

/* Canvas */
#canvas-container {
  flex: 1;
  position: relative;
  overflow: hidden;
  cursor: grab;
  min-height: 0;
}

#canvas-container:active { cursor: grabbing; }

svg#body-map {
  position: absolute;
  top: 0; left: 0;
  transform-origin: 0 0;
  will-change: transform;
}

#canvas-container.img-view {
  background: #ebe1cd;
}

.acu-point { cursor: pointer; }

/* Search */
.search-bar {
  position: absolute;
  top: 8px;
  left: 0; right: 0;
  z-index: 15;
}

.search-bar input {
  width: 100%;
  padding: 10px 14px 10px 36px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}

.search-bar input:focus { border-color: var(--accent); }
.search-bar input::placeholder { color: var(--text-muted); }

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

.search-results {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-top: 4px;
  max-height: 200px;
  overflow-y: auto;
  display: none;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.search-results.visible { display: block; }

.search-results .result-item {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  font-size: 13px;
  transition: background 0.15s;
}

.search-results .result-item:last-child { border-bottom: none; }
.search-results .result-item:hover { background: var(--accent-dim); }
.search-results .result-item .rid { color: var(--text-muted); font-size: 11px; margin-top: 2px; }

/* Zoom controls */
.zoom-controls {
  position: absolute;
  bottom: 16px;
  right: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  z-index: 15;
}

.zoom-controls button {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  transition: background 0.15s;
}

.zoom-controls button:active { background: var(--surface-raised); }

/* Info panel */
#info-panel {
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  background: var(--surface);
  border-top-left-radius: 20px;
  border-top-right-radius: 20px;
  padding: 14px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 20;
  max-height: 55%;
  overflow-y: auto;
  box-shadow: 0 -4px 30px rgba(0,0,0,0.4);
}

#info-panel.open { transform: translateY(0); }

.panel-handle {
  width: 36px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 12px;
}

#info-panel h2 {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 2px;
}

.point-id {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.info-section { margin-bottom: 12px; }

.info-section h3 {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  margin-bottom: 3px;
}

.info-section p {
  font-size: 14px;
  line-height: 1.55;
}

.warning {
  color: var(--accent);
  font-weight: 600;
}
</style>

<div id="app">
  <header>
    <h1>Mapa de Acupuntura</h1>
    <div class="view-toggle">
      <button class="active" data-view="front">Frontal</button>
      <button data-view="back">Dorsal</button>
      <button data-view="side">Lateral</button>
      <button data-view="hand">Mano</button>
      <button data-view="foot">Pie</button>
    </div>
  </header>

  <div class="filter-bar" id="filter-bar"></div>

  <div id="canvas-container">
    <div class="search-bar">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Buscar punto, meridiano o indicacion..." autocomplete="off">
      <div class="search-results" id="search-results"></div>
    </div>

    <svg id="body-map" xmlns="http://www.w3.org/2000/svg"></svg>

    <div class="zoom-controls">
      <button id="zoom-in">+</button>
      <button id="zoom-out">&minus;</button>
      <button id="zoom-fit" style="font-size:13px">&#8634;</button>
    </div>
  </div>

  <div id="info-panel">
    <div class="panel-handle"></div>
    <h2 id="point-name"></h2>
    <div class="point-id" id="point-code"></div>
    <div class="info-section"><h3>Meridiano</h3><p id="point-meridian"></p></div>
    <div class="info-section"><h3>Localización</h3><p id="point-location"></p></div>
    <div class="info-section"><h3>Indicaciones</h3><p id="point-indications"></p></div>
    <div class="info-section"><h3>Técnica</h3><p id="point-technique"></p></div>
  </div>
</div>

// Mirror symmetric points
const SVG_W=400, SVG_H=900, CENTER_X=200, TOL=15;
function getAllPoints(){
  const all=[];
  ACUPOINTS.forEach(p=>{
    all.push(p);
    const bodyViews=Object.entries(p.views).filter(([v])=>v!=="hand"&&v!=="foot");
    const needsMirror=bodyViews.some(([,c])=>Math.abs(c[0]-CENTER_X)>TOL);
    if(needsMirror){
      const m={...p,_mirrored:true,views:{}};
      for(const[v,[x,y]]of bodyViews) m.views[v]=[SVG_W-x,y];
      all.push(m);
    }
  });
  return all;
}

  side:[{y:895,l:"Cadera"},{y:1270,l:"Rodilla"},{y:1680,l:"Tobillo"}],
  hand:[{y:400,l:"Muñeca"},{y:300,l:"Metacarpos"},{y:110,l:"Dedos"}],
  foot:[{y:180,l:"Dedos"},{y:350,l:"Planta"},{y:550,l:"Talón"}]
};

// ===== APP =====
const NS="http://www.w3.org/2000/svg";
let currentView="front", currentMeridian="all", scale=1, panX=0, panY=0;
const allPoints=getAllPoints();

const container=document.getElementById("canvas-container");
const svg=document.getElementById("body-map");
const infoPanel=document.getElementById("info-panel");
const searchInput=document.getElementById("search-input");
const searchResults=document.getElementById("search-results");

function el(tag,attrs){
  const e=document.createElementNS(NS,tag);
  for(const[k,v]of Object.entries(attrs||{})) e.setAttribute(k,v);
  return e;
}

const VIEW_SIZES={front:[400,1887],back:[400,1819],side:[400,1839],hand:[300,678],foot:[310,808]};
const VIEW_IMAGES={front:"img/front.jpg",back:"img/back.jpg",side:"img/side.jpg",hand:"img/hand.jpg",foot:"img/foot.jpg"};
const HAS_IMAGE={front:true,back:true,side:true,hand:true,foot:true};

function drawView(view){
  const[vw,vh]=VIEW_SIZES[view]||[SVG_W,SVG_H];
  svg.setAttribute("viewBox",`0 0 ${vw} ${vh}`);
  svg.setAttribute("width",vw);
  svg.setAttribute("height",vh);
  svg.innerHTML="";

  const useImg=HAS_IMAGE[view];
  container.classList.toggle("img-view",!!useImg);

  svg.appendChild(el("rect",{width:vw,height:vh,fill:useImg?"transparent":"transparent"}));

  if(useImg){
    // Anatomical image background
    const img=el("image",{href:VIEW_IMAGES[view],x:0,y:0,width:vw,height:vh,preserveAspectRatio:"none"});
    svg.appendChild(img);
  } else {
    // SVG outline for hand/foot
    svg.appendChild(el("path",{d:BODY_OUTLINES[view]||"",fill:"rgba(255,255,255,0.03)",stroke:"rgba(255,255,255,0.12)","stroke-width":"1.2","stroke-linejoin":"round"}));
  }

  // Reference labels
  const refColor=useImg?"rgba(80,40,10,0.35)":"rgba(255,255,255,0.12)";
  const refLine=useImg?"rgba(80,40,10,0.15)":"rgba(255,255,255,0.08)";
  (BODY_REFS[view]||[]).forEach(r=>{
    svg.appendChild(el("line",{x1:10,x2:22,y1:r.y,y2:r.y,stroke:refLine,"stroke-width":"0.5"}));
    const t=el("text",{x:12,y:r.y-3,fill:refColor,"font-size":"6.5","font-family":"system-ui","font-weight":"600"});
    t.textContent=r.l; svg.appendChild(t);
  });

  // Points
  const pts=allPoints.filter(p=>p.views[view]);
  const labelFill=useImg?"rgba(30,10,0,0.75)":"rgba(255,255,255,0.55)";
  pts.forEach(p=>{
    if(currentMeridian!=="all"&&p.meridian!==currentMeridian) return;
    const[cx,cy]=p.views[view];
    const color=MERIDIAN_COLORS[p.meridian]||"#e05070";

    // Glow
    svg.appendChild(el("circle",{cx,cy,r:useImg?"10":"9",fill:color,opacity:useImg?"0.25":"0.12"}));
    // Dot
    const dot=el("circle",{cx,cy,r:"4",fill:color,stroke:useImg?"rgba(0,0,0,0.5)":"rgba(255,255,255,0.8)","stroke-width":useImg?"1":"0.7","data-id":p.id,style:"cursor:pointer"});
    dot.addEventListener("click",e=>{e.stopPropagation();showInfo(p);});
    svg.appendChild(dot);
    // Label
    const label=el("text",{x:+cx+7,y:+cy+3,fill:labelFill,"font-size":"5.5","font-family":"system-ui","font-weight":useImg?"700":"400"});
    if(useImg){
      label.setAttribute("stroke","rgba(235,225,205,0.7)");
      label.setAttribute("stroke-width","2");
      label.setAttribute("paint-order","stroke");
    }
    label.textContent=p.id; svg.appendChild(label);
  });
}

function showInfo(p){
  document.getElementById("point-name").textContent=`${p.nameEs} (${p.name})`;
  document.getElementById("point-code").textContent=p.id;
  document.getElementById("point-meridian").textContent=MERIDIAN_NAMES[p.meridian]||p.meridian;
  document.getElementById("point-location").textContent=p.location;

  const indEl=document.getElementById("point-indications");
  const hasWarning=p.indications.includes("CONTRAINDICADO")||p.indications.includes("PROHIBIDO")||p.indications.includes("NO PUNCIONAR");
  indEl.innerHTML=hasWarning? p.indications.replace(/(CONTRAINDICADO EN EMBARAZO|SOLO MOXIBUSTIÓN, NO PUNCIONAR|PROHIBIDO PUNCIONAR)/g,'<span class="warning">$1</span>') : p.indications;

  const techEl=document.getElementById("point-technique");
  techEl.innerHTML=p.technique.includes("PROHIBIDO")? p.technique.replace(/(PROHIBIDO PUNCIONAR)/g,'<span class="warning">$1</span>') : p.technique;

  infoPanel.classList.add("open");

  const useImg=HAS_IMAGE[currentView];
  svg.querySelectorAll("circle[data-id]").forEach(c=>{
    const isActive=c.getAttribute("data-id")===p.id;
    c.setAttribute("stroke-width",isActive?"2.5":(useImg?"1":"0.7"));
    c.setAttribute("r",isActive?"6":"4");
    if(isActive) c.setAttribute("stroke","#fff");
  });
}

function navigateTo(p){
  const views=Object.keys(p.views);
  if(!views.includes(currentView)){
    currentView=views[0];
    document.querySelectorAll(".view-toggle button").forEach(b=>b.classList.toggle("active",b.dataset.view===currentView));
    drawView(currentView);
  }
  const[px,py]=p.views[currentView];
  const rect=container.getBoundingClientRect();
  scale=2.5;
  panX=rect.width/2-px*scale;
  panY=rect.height/2-py*scale;
  applyTransform();
  showInfo(p);
}

// Pan & zoom
function applyTransform(){svg.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;}

function fitToScreen(){
  const rect=container.getBoundingClientRect();
  const[vw,vh]=VIEW_SIZES[currentView]||[SVG_W,SVG_H];
  scale=Math.min(rect.width/vw,rect.height/vh)*0.88;
  panX=(rect.width-vw*scale)/2;
  panY=(rect.height-vh*scale)/2;
  applyTransform();
}

function zoomAt(cx,cy,factor){
  const rect=container.getBoundingClientRect();
  const x=cx-rect.left, y=cy-rect.top;
  const ns=Math.max(0.5,Math.min(8,scale*factor));
  const r=ns/scale;
  panX=x-r*(x-panX); panY=y-r*(y-panY); scale=ns;
  applyTransform();
}

(function setupPanZoom(){
  let drag=false, sx, sy, lastDist=0;
  container.addEventListener("pointerdown",e=>{
    if(e.target.closest(".search-bar,.zoom-controls")) return;
    drag=true; sx=e.clientX-panX; sy=e.clientY-panY;
    container.setPointerCapture(e.pointerId);
  });
  container.addEventListener("pointermove",e=>{if(drag){panX=e.clientX-sx;panY=e.clientY-sy;applyTransform();}});
  container.addEventListener("pointerup",()=>drag=false);
  container.addEventListener("pointercancel",()=>drag=false);

  container.addEventListener("touchstart",e=>{
    if(e.touches.length===2) lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  },{passive:true});
  container.addEventListener("touchmove",e=>{
    if(e.touches.length===2){
      e.preventDefault();
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      const mx=(e.touches[0].clientX+e.touches[1].clientX)/2;
      const my=(e.touches[0].clientY+e.touches[1].clientY)/2;
      zoomAt(mx,my,d/lastDist); lastDist=d;
    }
  },{passive:false});
  container.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY>0?0.9:1.1);},{passive:false});
})();

// Setup
document.getElementById("zoom-in").onclick=()=>{const r=container.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1.3);};
document.getElementById("zoom-out").onclick=()=>{const r=container.getBoundingClientRect();zoomAt(r.width/2,r.height/2,0.77);};
document.getElementById("zoom-fit").onclick=fitToScreen;

document.querySelectorAll(".view-toggle button").forEach(b=>b.onclick=()=>{
  currentView=b.dataset.view;
  document.querySelectorAll(".view-toggle button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); drawView(currentView); fitToScreen();
});

// Filter bar
const filterBar=document.getElementById("filter-bar");
const allChip=document.createElement("button");
allChip.className="filter-chip active"; allChip.dataset.meridian="all"; allChip.textContent="Todos";
filterBar.appendChild(allChip);
for(const[k,v]of Object.entries(MERIDIAN_LABELS)){
  const c=document.createElement("button"); c.className="filter-chip"; c.dataset.meridian=k; c.textContent=v;
  c.style.borderColor=MERIDIAN_COLORS[k]+"44"; filterBar.appendChild(c);
}
filterBar.addEventListener("click",e=>{
  const chip=e.target.closest(".filter-chip"); if(!chip) return;
  currentMeridian=chip.dataset.meridian;
  filterBar.querySelectorAll(".filter-chip").forEach(c=>c.classList.remove("active"));
  chip.classList.add("active"); drawView(currentView);
});

// Search
searchInput.addEventListener("input",()=>{
  const q=searchInput.value.toLowerCase().trim();
  if(q.length<2){searchResults.classList.remove("visible");return;}
  const uniq=new Map();
  ACUPOINTS.forEach(p=>{
    if(p.id.toLowerCase().includes(q)||p.name.toLowerCase().includes(q)||p.nameEs.toLowerCase().includes(q)||p.indications.toLowerCase().includes(q)||p.meridian.toLowerCase().includes(q))
      if(!uniq.has(p.id)) uniq.set(p.id,p);
  });
  const res=[...uniq.values()].slice(0,8);
  if(!res.length){searchResults.innerHTML='<div class="result-item" style="color:var(--text-muted)">Sin resultados</div>';}
  else{
    searchResults.innerHTML=res.map(p=>`<div class="result-item" data-id="${p.id}"><strong>${p.id}</strong> — ${p.nameEs} (${p.name})<div class="rid">${p.indications.substring(0,55)}...</div></div>`).join("");
    searchResults.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>{
      const pt=ACUPOINTS.find(p=>p.id===el.dataset.id);
      if(pt){navigateTo(pt);searchResults.classList.remove("visible");searchInput.value="";searchInput.blur();}
    });
  }
  searchResults.classList.add("visible");
});
searchInput.addEventListener("focus",()=>{if(searchInput.value.length>=2)searchResults.classList.add("visible");});
document.addEventListener("click",e=>{if(!e.target.closest(".search-bar"))searchResults.classList.remove("visible");});

// Close panel
container.addEventListener("click",e=>{if(e.target===container||e.target===svg||e.target.tagName==="rect")infoPanel.classList.remove("open");});
let panelY=0;
infoPanel.addEventListener("touchstart",e=>panelY=e.touches[0].clientY,{passive:true});
infoPanel.addEventListener("touchmove",e=>{if(e.touches[0].clientY-panelY>50)infoPanel.classList.remove("open");},{passive:true});

window.addEventListener("resize",fitToScreen);
drawView(currentView);
fitToScreen();
</script>
